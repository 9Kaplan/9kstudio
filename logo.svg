<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="premium-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#818CF8" /> <stop offset="1" stop-color="#38BDF8" /> </linearGradient>
        
        <filter id="inner-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
            <feOffset dx="4" dy="4" result="offsetBlur"/>
            <feSpecularLighting in="blur" surfaceScale="5" specularConstant=".75" specularExponent="20" lighting-color="#ffffff" result="specOut">
                <fePointLight x="-5000" y="-10000" z="20000"/>
            </feSpecularLighting>
            <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
            <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint"/>
        </filter>
    </defs>

    <rect width="512" height="512" rx="120" fill="#151921" stroke="url(#premium-gradient)" stroke-width="10"/>

    <path d="M210 130H180C146.863 130 120 156.863 120 190V230C120 263.137 146.863 290 180 290H210C243.137 290 270 263.137 270 230V190C270 156.863 243.137 130 210 130Z" stroke="url(#premium-gradient)" stroke-width="35" stroke-linecap="round"/>
    <path d="M270 230V380" stroke="url(#premium-gradient)" stroke-width="35" stroke-linecap="round"/>

    <path d="M300 130V380" stroke="url(#premium-gradient)" stroke-width="35" stroke-linecap="round"/>
    <path d="M390 130L300 255" stroke="url(#premium-gradient)" stroke-width="35" stroke-linecap="round"/>
    <path d="M300 255L390 380" stroke="url(#premium-gradient)" stroke-width="35" stroke-linecap="round"/>
    
    <circle cx="430" cy="80" r="10" fill="#38BDF8" fill-opacity="0.8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
</svg>